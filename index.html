<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLG MAFIA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --red: #e01924;
  --black: #080808;
  --dark: #151515;
  --grey: #242424;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--black);
  color: var(--white);
  font-family: Arial, sans-serif;
  padding-bottom: 100px;
}

header {
  text-align: center;
  padding: 25px 15px;
  border-bottom: 2px solid var(--red);
  background: #101010;
}

.logo {
  max-width: 150px;
  max-height: 120px;
  object-fit: contain;
  margin-bottom: 10px;
}

header h1 {
  color: var(--red);
  font-size: 28px;
  letter-spacing: 3px;
}

header p {
  color: #aaa;
  font-size: 12px;
  margin-top: 7px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 18px;
}

.section-title {
  color: var(--red);
  font-size: 21px;
  margin: 15px 0;
  text-transform: uppercase;
}

.categories {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 25px;
}

.category-btn {
  background: var(--dark);
  color: white;
  border: 1px solid var(--red);
  border-radius: 8px;
  padding: 13px 5px;
  font-weight: bold;
  cursor: pointer;
}

.category-btn.active {
  background: var(--red);
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.product {
  background: var(--dark);
  border: 1px solid #333;
  border-radius: 10px;
  padding: 15px;
  text-align: center;
}

.product h3 {
  margin-bottom: 8px;
  font-size: 16px;
}

.product p {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 12px;
}

.gallery {
  margin-top: 30px;
}

.gallery video {
  width: 100%;
  border-radius: 10px;
  margin-top: 12px;
  background: #111;
}

.cart-box {
  background: var(--dark);
  border: 1px solid var(--red);
  border-radius: 10px;
  padding: 15px;
  margin-top: 20px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #333;
  padding: 12px 0;
  font-size: 14px;
}

.remove-btn {
  background: #333;
  color: white;
  border: none;
  padding: 7px 10px;
  border-radius: 5px;
  cursor: pointer;
}

.total {
  color: var(--red);
  font-size: 20px;
  font-weight: bold;
  text-align: right;
  margin-top: 18px;
}

.demo-note {
  color: #999;
  font-size: 12px;
  text-align: center;
  margin-top: 15px;
  line-height: 1.5;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  gap: 8px;
  padding: 12px 8px;
  background: #101010;
  border-top: 2px solid var(--red);
  z-index: 100;
}

.navbtn {
  flex: 1;
  background: #202020;
  color: white;
  border: 1px solid var(--red);
  border-radius: 8px;
  padding: 12px 5px;
  font-size: 14px;
  cursor: pointer;
}

.navbtn b {
  margin-left: 4px;
}

.navbtn:active,
.category-btn:active {
  transform: scale(0.96);
}

.hidden {
  display: none;
}

@media (max-width: 380px) {
  .navbtn {
    font-size: 12px;
  }

  .categories {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <img
    src="blg-logo.jpeg"
    alt="BLG Logo"
    class="logo"
    onerror="this.style.display='none'"
  >

  <h1>BLG MAFIA</h1>
  <p>WELCOME TO BLG INDUSTRY</p>
</header>

<main>

  <!-- BOUTIQUE -->
  <section id="shopPage">

    <h2 class="section-title">⚡ Boutique</h2>

    <div class="categories">

      <button class="category-btn active"
        onclick="showCategory('mousseux', this)">
        🧽 Mousseux 🧽
      </button>

      <button class="category-btn"
        onclick="showCategory('filtre', this)">
        🍫 Filtré 🍫
      </button>

      <button class="category-btn"
        onclick="showCategory('haze', this)">
        🍁 Haze 🍁
      </button>

    </div>

    <div id="products" class="products"></div>

    <div class="gallery">
      <h2 class="section-title">🎬 Galerie vidéo</h2>

      <video controls playsinline>
        <source src="videos/presentation.mp4" type="video/mp4">
        Votre navigateur ne prend pas en charge les vidéos.
      </video>

      <p class="demo-note">
        Les vidéos de présentation seront affichées ici.
      </p>
    </div>

  </section>

  <!-- PANIER -->
  <section id="cartPage" class="hidden">

    <h2 class="section-title">🛒 Mon panier</h2>

    <div class="cart-box">
      <div id="cartItems">
        <p class="demo-note">Ton panier est vide.</p>
      </div>

      <div class="total">
        Total : <span id="cartTotal">0</span> €
      </div>

      <p class="demo-note">
        Panier de démonstration uniquement.
        Aucune commande ou transaction n'est effectuée.
      </p>
    </div>

  </section>

</main>

<!-- NAVIGATION -->
<nav>

  <button class="navbtn" onclick="goHome()">
    🏠 <b>Boutique</b>
  </button>

  <button class="navbtn" onclick="showCart()">
    🛒 <b>Panier</b>
    (<span id="cartCount">0</span>)
  </button>

  <button class="navbtn" onclick="openContact()">
    📱 <b>Contact</b>
  </button>

</nav>

<script>

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

// Catégories de présentation
const data = {
  mousseux: [
    {
      name: "🧽 Mousseux 🧽",
      description: "Présentation de la catégorie"
    }
  ],

  filtre: [
    {
      name: "🍫 Filtré 🍫",
      description: "Présentation de la catégorie"
    }
  ],

  haze: [
    {
      name: "🍁 Haze 🍁",
      description: "Présentation de la catégorie"
    }
  ]
};

function showCategory(category, button) {

  document.querySelectorAll(".category-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  const container = document.getElementById("products");
  container.innerHTML = "";

  data[category].forEach(product => {

    const card = document.createElement("div");
    card.className = "product";

    const title = document.createElement("h3");
    title.textContent = product.name;

    const description = document.createElement("p");
    description.textContent = product.description;

    card.appendChild(title);
    card.appendChild(description);

    container.appendChild(card);
  });
}

function goHome() {
  document.getElementById("shopPage").classList.remove("hidden");
  document.getElementById("cartPage").classList.add("hidden");
}

function showCart() {
  document.getElementById("shopPage").classList.add("hidden");
  document.getElementById("cartPage").classList.remove("hidden");
}

function openContact() {

  const url = "https://t.me/blgindustry1";

  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(url);
  } else {
    window.open(url, "_blank");
  }
}

// Chargement initial
showCategory(
  "mousseux",
  document.querySelector(".category-btn")
);

</script>

</body>
</html>
