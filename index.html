<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DBZ Social Club 19</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b16;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

#background-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 1;
    pointer-events: none;
}

.page {
    position: relative;
    z-index: 2;
    max-width: 760px;
    min-height: 100vh;
    margin: auto;
    padding: 15px;
}

.banniere {
    width: 100%;
    border: 3px solid #ff7900;
    border-radius: 22px;
    box-shadow: 0 0 18px #ff6500;
}

.titre {
    text-align: center;
    color: #ffd12f;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 3px;
    margin: 25px 0;
    text-shadow: 2px 3px 0 #7b2100;
}

/* CATEGORIES */

.categories {
    display: grid;
    gap: 15px;
}

.categorie {
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    border: 2px solid #ff7900;
    border-radius: 25px;
    background: rgba(12,39,64,.9);
    cursor: pointer;
    font-size: 23px;
    font-weight: 900;
    text-align: center;
    text-transform: uppercase;
}

.categorie.bleue {
    border-color: #168de8;
}

.categorie:active {
    transform: scale(.98);
}

/* PRODUITS */

.produits {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.produit {
    background: rgba(8,25,45,.95);
    border: 2px solid #ff7900;
    border-radius: 18px;
    padding: 10px;
    text-align: center;
    overflow: hidden;
}

.produit img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 12px;
    background: #14283b;
}

.produit h3 {
    font-size: 17px;
    overflow-wrap: anywhere;
}

.prix {
    color: #ffd12f;
    font-size: 21px;
    font-weight: 900;
}

.quantite {
    width: 65px;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid #168de8;
    text-align: center;
    font-size: 16px;
    margin: 8px;
}

button {
    border: none;
    cursor: pointer;
    font-weight: 900;
}

.bouton {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: #ff7900;
    color: white;
    font-size: 14px;
    margin-top: 8px;
}

.bouton:hover {
    background: #ff9b24;
}

.retour {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border-radius: 12px;
    background: #168de8;
    color: white;
    font-size: 16px;
}

/* PANIER */

.ligne-panier {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 15px 5px;
    border-bottom: 1px solid #ff7900;
}

.ligne-panier button {
    background: #bd2929;
    color: white;
    padding: 8px;
    border-radius: 8px;
}

.total {
    text-align: center;
    font-size: 25px;
    color: #ffd12f;
    font-weight: 900;
    margin: 25px 0;
}

.telegram {
    display: block;
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    background: #168de8;
    color: white;
    font-size: 18px;
    font-weight: 900;
    text-decoration: none;
    margin-top: 15px;
}

.vide {
    text-align: center;
    padding: 35px 10px;
    color: #ccc;
}

/* NAVIGATION */

.footer {
    position: sticky;
    bottom: 0;
    display: flex;
    justify-content: space-around;
    gap: 10px;
    padding: 12px;
    margin-top: 25px;
    border-top: 2px solid #ff7900;
    background: rgba(5,12,25,.97);
    border-radius: 12px;
}

.footer button {
    background: transparent;
    color: #ffd12f;
    font-size: 17px;
    padding: 10px;
}

.cache {
    display: none !important;
}

.mention {
    text-align: center;
    margin: 25px 0;
    font-size: 13px;
}

@media(max-width:500px) {

    .produits {
        grid-template-columns: repeat(2,1fr);
        gap: 9px;
    }

    .produit img {
        height: 145px;
    }

    .produit h3 {
        font-size: 14px;
    }

    .titre {
        font-size: 20px;
    }

    .categorie {
        font-size: 19px;
    }

}

</style>
</head>

<body>

<video id="background-video" autoplay muted loop playsinline>
    <source src="blg-logo.mp4" type="video/mp4">
</video>

<div class="page">

<img class="banniere" src="banniére.jpeg">

<!-- ACCUEIL -->

<section id="accueil">

<h1 class="titre">CHOISIS TA CATÉGORIE</h1>

<div class="categories" id="categories"></div>

</section>

<!-- BOUTIQUE -->

<section id="boutique" class="cache">

<button class="retour" onclick="accueil()">
    ← RETOUR AUX CATÉGORIES
</button>

<h1 class="titre" id="titreCategorie"></h1>

<div class="produits" id="produits"></div>

</section>

<!-- PANIER -->

<section id="panier" class="cache">

<button class="retour" onclick="accueil()">
    ← CONTINUER
</button>

<h1 class="titre">MON PANIER</h1>

<div id="contenuPanier"></div>

<div class="total" id="total"></div>

<a id="commandeTelegram"
   class="telegram"
   href="#"
   target="_blank">
   ENVOYER MA COMMANDE
</a>

</section>

<div class="mention">
    Produits vérifiés - Vente réservée aux adultes.
</div>

<!-- NAVIGATION BASSE -->

<div class="footer">

<button onclick="accueil()">
    🏬 Boutique
</button>

<button onclick="ouvrirPanier()">
    🛒 Panier (<span id="nombrePanier">0</span>)
</button>

</div>

</div>

<script>

/* =================================
   CONFIGURATION À PERSONNALISER
================================= */

const TELEGRAM = "montelegram";


/* =================================
   CATÉGORIES ET PRODUITS

   Tu remplis les informations ici.

   image = chemin de la photo
   nom = nom du produit
   prix = prix du produit
================================= */

const categories = [

{
    nom: "NOM DE LA CATÉGORIE 1",
    produits: [

        {
            nom: "NOM DU PRODUIT",
            prix: 0,
            image: "image1.jpg"
        }

    ]
},

{
    nom: "NOM DE LA CATÉGORIE 2",
    produits: []
},

{
    nom: "NOM DE LA CATÉGORIE 3",
    produits: []
},

{
    nom: "NOM DE LA CATÉGORIE 4",
    produits: []
},

{
    nom: "NOM DE LA CATÉGORIE 5",
    produits: []
},

{
    nom: "NOM DE LA CATÉGORIE 6",
    produits: []
}

];


/* =================================
   VARIABLES
================================= */

let panier = [];


/* =================================
   NAVIGATION
================================= */

function masquerTout() {

    document.getElementById("accueil")
        .classList.add("cache");

    document.getElementById("boutique")
        .classList.add("cache");

    document.getElementById("panier")
        .classList.add("cache");

}

function accueil() {

    masquerTout();

    document.getElementById("accueil")
        .classList.remove("cache");

}

function ouvrirBoutique(index) {

    masquerTout();

    document.getElementById("boutique")
        .classList.remove("cache");

    afficherProduits(index);

}

function ouvrirPanier() {

    masquerTout();

    document.getElementById("panier")
        .classList.remove("cache");

    afficherPanier();

}


/* =================================
   AFFICHAGE DES CATÉGORIES
================================= */

function afficherCategories() {

    const zone = document.getElementById("categories");

    zone.innerHTML = "";

    categories.forEach((categorie,index) => {

        const bouton = document.createElement("button");

        bouton.className =
            "categorie " + (index >= 4 ? "bleue" : "");

        bouton.textContent = categorie.nom;

        bouton.onclick = () => ouvrirBoutique(index);

        zone.appendChild(bouton);

    });

}


/* =================================
   AFFICHAGE DES PRODUITS
================================= */

function afficherProduits(index) {

    const categorie = categories[index];

    document.getElementById("titreCategorie")
        .textContent = categorie.nom;

    const zone = document.getElementById("produits");

    zone.innerHTML = "";

    if(categorie.produits.length === 0) {

        zone.innerHTML =
            '<div class="vide">Aucun produit renseigné.</div>';

        return;

    }

    categorie.produits.forEach((produit,i) => {

        const carte = document.createElement("div");

        carte.className = "produit";

        carte.innerHTML = `

            <img src="${produit.image}"
                 alt="">

            <h3>${produit.nom}</h3>

            <div class="prix">
                ${Number(produit.prix).toFixed(2)} €
            </div>

            <input
                class="quantite"
                type="number"
                min="1"
                value="1"
                id="quantite-${index}-${i}"
            >

            <button class="bouton"
                onclick="ajouterPanier(${index},${i})">

                AJOUTER AU PANIER

            </button>

        `;

        zone.appendChild(carte);

    });

}


/* =================================
   AJOUT AU PANIER
================================= */

function ajouterPanier(index,i) {

    const produit = categories[index].produits[i];

    const quantite = parseInt(

        document.getElementById(
            `quantite-${index}-${i}`
        ).value

    );

    if(!Number.isInteger(quantite) || quantite < 1) {

        alert("Quantité incorrecte.");

        return;

    }

    const existant = panier.find(p =>
        p.index === index && p.id === i
    );

    if(existant) {

        existant.quantite += quantite;

    } else {

        panier.push({

            index: index,
            id: i,
            nom: produit.nom,
            prix: Number(produit.prix),
            quantite: quantite

        });

    }

    actualiserNombre();

    alert("Produit ajouté au panier !");

}


/* =================================
   NOMBRE D'ARTICLES
================================= */

function actualiserNombre() {

    const nombre = panier.reduce(
        (total,p) => total + p.quantite,
        0
    );

    document.getElementById("nombrePanier")
        .textContent = nombre;

}


/* =================================
   AFFICHAGE DU PANIER
================================= */

function afficherPanier() {

    const zone = document.getElementById("contenuPanier");

    zone.innerHTML = "";

    let total = 0;

    if(panier.length === 0) {

        zone.innerHTML =
            '<div class="vide">Votre panier est vide.</div>';

    }

    panier.forEach((produit,index) => {

        const sousTotal =
            produit.prix * produit.quantite;

        total += sousTotal;

        const ligne = document.createElement("div");

        ligne.className = "ligne-panier";

        ligne.innerHTML = `

            <div>

                <strong>${produit.nom}</strong>

                <br>

                ${produit.prix.toFixed(2)} €

                <br>

                Quantité : ${produit.quantite}

                <br>

                Sous-total : ${sousTotal.toFixed(2)} €

            </div>

            <button onclick="supprimerProduit(${index})">

                SUPPRIMER

            </button>

        `;

        zone.appendChild(ligne);

    });

    document.getElementById("total").textContent =
        "TOTAL : " + total.toFixed(2) + " €";

    preparerCommande(total);

}


/* =================================
   SUPPRESSION
================================= */

function supprimerProduit(index) {

    panier.splice(index,1);

    actualiserNombre();

    afficherPanier();

}


/* =================================
   ENVOI TELEGRAM
================================= */

function preparerCommande(total) {

    let message = "NOUVELLE COMMANDE\n\n";

    panier.forEach(produit => {

        message +=
            produit.nom +
            "\nQuantité : " + produit.quantite +
            "\nPrix unitaire : " +
            produit.prix.toFixed(2) + " €" +
            "\nSous-total : " +
            (produit.prix * produit.quantite).toFixed(2) +
            " €\n\n";

    });

    message +=
        "TOTAL : " + total.toFixed(2) + " €";

    const lien =
        "https://t.me/" +
        TELEGRAM +
        "?text=" +
        encodeURIComponent(message);

    document.getElementById("commandeTelegram")
        .href = lien;

}


/* =================================
   INITIALISATION
================================= */

afficherCategories();

actualiserNombre();

</script>

</body>
</html>
