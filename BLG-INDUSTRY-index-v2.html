<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>BLG INDUSTRY</title>
<style>
:root{color-scheme:dark;--red:#e01924}
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 16px}
header img{width:min(190px,55vw);height:auto}
h1{font-size:25px;letter-spacing:4px;margin:14px 0 4px}
.sub,.section-title{color:#aaa;letter-spacing:2px;font-size:12px}
main{max-width:620px;margin:auto;padding:12px 18px 100px}
.section-title{margin:18px 0}
.category{width:100%;padding:24px 18px;margin:10px 0;background:#151515;border:1px solid var(--red);border-radius:9px;color:white;text-align:left;font-size:20px;font-weight:bold;letter-spacing:2px;cursor:pointer}
.category span{float:right;color:var(--red);font-size:24px}
.back{background:none;border:0;color:var(--red);padding:12px 0;font-weight:bold;cursor:pointer}
.product,.cart-row{background:#151515;border:1px solid #333;border-radius:9px;padding:16px;margin:10px 0}
.product{display:flex;align-items:center;justify-content:space-between;gap:12px}
.price{color:var(--red);font-weight:bold;margin-top:6px}
.qty{display:flex;align-items:center;gap:12px}
.qty button,.remove{background:#222;border:1px solid var(--red);color:white;border-radius:6px;width:34px;height:34px;font-size:20px;cursor:pointer}
.primary{padding:14px;border-radius:7px;background:var(--red);border:0;color:white;width:100%;font-weight:bold;margin-top:12px;cursor:pointer}
.total{text-align:right;font-size:22px;font-weight:bold;margin:20px 2px}
.empty,.notice{color:#888;text-align:center}
.notice{font-size:11px;line-height:1.5;margin:28px 5px}
nav{position:fixed;bottom:0;left:0;right:0;background:#101010;border-top:1px solid #333;display:flex;justify-content:center;gap:18px;padding:12px}
.navbtn{background:none;border:0;color:white;padding:8px 16px;cursor:pointer}
.navbtn b{color:var(--red)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
<img src="blg-logo.jpeg" alt="BLG INDUSTRY">
<h1>BLG INDUSTRY</h1>
<div class="sub">SÉLECTION CBD</div>
</header>
<main>
<section id="home">
<div class="section-title">CHOISIS TA CATÉGORIE</div>
<button class="category" onclick="showCategory('Mousseux')">MOUSSEUX <span>›</span></button>
<button class="category" onclick="showCategory('Filtré')">FILTRÉ <span>›</span></button>
<button class="category" onclick="showCategory('Haze')">HAZE <span>›</span></button>
</section>
<section id="catalog" class="hidden">
<button class="back" onclick="goHome()">‹ RETOUR</button>
<div class="section-title" id="catTitle"></div>
<div id="products"></div>
</section>
<section id="cart" class="hidden">
<button class="back" onclick="goHome()">‹ RETOUR À LA BOUTIQUE</button>
<div class="section-title">MON PANIER</div>
<div id="cartItems"></div>
<div class="total" id="total"></div>
<p class="notice">Panier de démonstration : aucun paiement ni aucune commande n’est envoyé depuis cette page.</p>
</section>
<p class="notice">Produits CBD. Vérifier la conformité et les informations réglementaires avant commercialisation. Vente réservée aux adultes.</p>
</main>
<nav>
<button class="navbtn" onclick="goHome()">⌂ <b>Boutique</b></button>
<button class="navbtn" onclick="showCart()">▣ <b>Panier</b> (<span id="cartCount">0</span>)</button>
</nav>
<script>
const data = {
'Mousseux':[{w:'4 g',p:20},{w:'10 g',p:50},{w:'25 g',p:120},{w:'50 g',p:200}],
'Filtré':[{w:'2 g',p:20},{w:'5 g',p:40},{w:'10 g',p:70},{w:'50 g',p:300}],
'Haze':[{w:'3 g',p:20},{w:'6 g',p:40},{w:'10 g',p:60},{w:'25 g',p:140}]
};
let cart = {};
const euro = n => n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function show(id){['home','catalog','cart'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));}
function goHome(){show('home');}
function showCategory(name){
 show('catalog');
 document.getElementById('catTitle').textContent=name.toUpperCase();
 document.getElementById('products').innerHTML=data[name].map((x,i)=>`
 <div class="product"><div><b>${x.w}</b><div class="price">${euro(x.p)}</div></div>
 <div class="qty"><button onclick="change('${name}',${i},-1)">−</button>
 <span id="q-${i}">${cart[name+'|'+i]||0}</span>
 <button onclick="change('${name}',${i},1)">+</button></div></div>`).join('')+
 '<button class="primary" onclick="showCart()">VOIR MON PANIER</button>';
}
function change(name,i,d){
 const key=name+'|'+i;
 cart[key]=Math.max(0,(cart[key]||0)+d);
 if(!cart[key])delete cart[key];
 document.getElementById('q-'+i).textContent=cart[key]||0;
 updateCount();
}
function updateCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0);}
function showCart(){
 show('cart');
 let total=0;
 const entries=Object.entries(cart);
 document.getElementById('cartItems').innerHTML=entries.length?entries.map(([key,q])=>{
 const [name,index]=key.split('|');
 const item=data[name][Number(index)];
 const sum=item.p*q; total+=sum;
 return `<div class="cart-row">
 <div class="product" style="border:0;padding:0;margin:0"><div><b>${name} · ${item.w}</b>
 <div class="price">${euro(item.p)} / unité</div></div>
 <div class="qty"><button onclick="cartChange('${key}',-1)">−</button><span>${q}</span>
 <button onclick="cartChange('${key}',1)">+</button></div></div>
 <div style="display:flex;justify-content:space-between;margin-top:14px"><b>${euro(sum)}</b>
 <button class="remove" onclick="removeItem('${key}')">×</button></div></div>`;
 }).join(''):'<div class="empty">Ton panier est vide pour le moment.</div>';
 document.getElementById('total').textContent='Total : '+euro(total);
}
function cartChange(key,d){cart[key]=Math.max(0,cart[key]+d);if(!cart[key])delete cart[key];updateCount();showCart();}
function removeItem(key){delete cart[key];updateCount();showCart();}
</script>
</body>
</html>
